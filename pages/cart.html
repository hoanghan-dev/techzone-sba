<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ Hàng - TechZone</title>

  <!-- Bootstrap 5 & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <span><i class="bi bi-headset me-1"></i> Hotline: <strong>0916 973 161</strong></span>
        <span><i class="bi bi-envelope me-1"></i> support@techzone.vn</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="../admin/dashboard.html" class="text-decoration-none"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
        <span>|</span>
        <a href="orders.html" class="text-decoration-none"><i class="bi bi-truck me-1"></i> Tra cứu đơn hàng</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="navbar-main d-flex justify-content-between align-items-center gap-3">
        <a href="../index.html" class="brand-logo text-decoration-none">
          TechZone<span class="dot">.</span>
        </a>

        <div class="header-search flex-grow-1 mx-md-4">
          <form action="products.html" method="GET">
            <div class="input-group">
              <input type="text" name="txtSearch" class="form-control" placeholder="Tìm kiếm laptop, điện thoại, phụ kiện..." required>
              <button class="btn btn-search" type="submit"><i class="bi bi-search fs-6"></i></button>
            </div>
          </form>
        </div>

        <div class="nav-actions">
          <div id="user-auth-menu"></div>
          <a href="cart.html" class="nav-action-btn cart-badge-icon text-decoration-none">
            <i class="bi bi-cart3 fs-4"></i>
            <span class="cart-counter" style="display: none;">0</span>
            <span class="d-none d-lg-inline">Giỏ hàng</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Cart Content -->
  <main class="py-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 fw-bold mb-0">Giỏ Hàng Của Bạn</h1>
        <a href="products.html" class="text-primary text-decoration-none small fw-semibold">
          <i class="bi bi-arrow-left me-1"></i> Tiếp tục mua hàng
        </a>
      </div>

      <!-- Table Header Bar -->
      <div class="card border-0 shadow-sm rounded-3 mb-3 d-none d-md-block bg-white">
        <div class="card-body p-3">
          <div class="row align-items-center fw-semibold text-secondary small">
            <div class="col-5 d-flex align-items-center gap-3">
              <input type="checkbox" class="form-check-input mt-0" id="select-all-header" style="width: 20px; height: 20px; cursor: pointer;">
              <label for="select-all-header" class="cursor-pointer mb-0">Sản phẩm</label>
            </div>
            <div class="col-2 text-center">Đơn giá</div>
            <div class="col-2 text-center">Số lượng</div>
            <div class="col-3 text-end">Số tiền</div>
          </div>
        </div>
      </div>

      <!-- Cart Items List Container -->
      <div id="cart-items-list">
        <!-- Rendered by JS -->
      </div>

      <!-- Sticky Bottom Summary Bar -->
      <div class="card border-0 shadow-lg rounded-4 p-3 bg-white mt-4" id="cart-summary-section">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="select-all-footer" style="width: 20px; height: 20px; cursor: pointer;">
              <label class="form-check-label fw-semibold" for="select-all-footer">
                Chọn tất cả
              </label>
            </div>
            <button type="button" class="btn btn-link text-danger text-decoration-none p-0" onclick="removeSelectedCartItems()">
              <i class="bi bi-trash3 me-1"></i>Xóa đã chọn
            </button>
          </div>

          <div class="d-flex align-items-center justify-content-between justify-content-md-end gap-4">
            <div class="text-end">
              <span class="text-muted small">Tổng thanh toán (<span id="selected-count" class="fw-bold text-dark">0</span> sản phẩm):</span>
              <div class="price fs-4" id="cart-subtotal">0₫</div>
            </div>
            <button type="button" class="btn btn-primary btn-lg px-5 rounded-pill fw-bold" id="btn-go-checkout" onclick="proceedToCheckout()" disabled>
              Mua Hàng
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer bg-dark text-white pt-5 pb-4 mt-5">
    <div class="container text-center text-secondary small">
      © 2026 TechZone. All rights reserved. Bản quyền thuộc về PRJ301_SE1910_G6.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
